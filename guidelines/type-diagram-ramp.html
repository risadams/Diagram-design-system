<!-- @dsCard group="Type" viewport="700x200" subtitle="Standard size class — presentation and print ramps scale up" name="Diagram type ramp" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Diagram ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  body{display:block}
 table{border-collapse:collapse;width:100%;font-size:13px}
 td{padding:5px 8px;border-bottom:var(--rule-dashed)}
 td:first-child{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase;width:150px}
 td:last-child{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-align:right}
</style></head><body><table>
<tr><td>title</td><td style="font-size:22px">Fraunces 400</td><td>28px</td></tr>
<tr><td>node-name</td><td style="font-weight:600">Fraunces 600</td><td>12px</td></tr>
<tr><td>sublabel</td><td style="font-family:var(--font-mono);font-size:12px">JetBrains Mono</td><td>9px</td></tr>
<tr><td>arrow-label</td><td style="font-family:var(--font-mono);font-size:12px;letter-spacing:.06em">JETBRAINS MONO</td><td>8px</td></tr>
<tr><td>callout</td><td style="font-style:italic">Fraunces italic</td><td>14px</td></tr>
<tr><td>margin-note</td><td style="font-family:var(--font-hand);font-size:20px">Caveat</td><td>18px</td></tr>
</table></body></html>
