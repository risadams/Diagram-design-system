<!-- @dsCard group="Diagram roles" viewport="700x160" subtitle="Opt-in CLI skin, recut in parchment" name="Terminal skin" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Terminal skin</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  body{background:#14100e;color:#f0e6d2}.chip{border-color:#3a2d26}.name{color:#a89e8f}.hex{color:#6e665b}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#14100e"></div><div class="name">page</div><div class="hex">#14100e</div></div><div class="sw"><div class="chip" style="background:#1a1210"></div><div class="name">paper</div><div class="hex">#1a1210</div></div><div class="sw"><div class="chip" style="background:#241c19"></div><div class="name">bar</div><div class="hex">#241c19</div></div><div class="sw"><div class="chip" style="background:#3a2d26"></div><div class="name">border</div><div class="hex">#3a2d26</div></div><div class="sw"><div class="chip" style="background:#f0e6d2"></div><div class="name">ink</div><div class="hex">#f0e6d2</div></div><div class="sw"><div class="chip" style="background:#a89e8f"></div><div class="name">muted</div><div class="hex">#a89e8f</div></div><div class="sw"><div class="chip" style="background:#e24a8a"></div><div class="name">accent</div><div class="hex">#e24a8a</div></div></div></body></html>
