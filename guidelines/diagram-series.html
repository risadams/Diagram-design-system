<!-- @dsCard group="Diagram roles" viewport="700x150" subtitle="Multi-series charts only — the ink chorus, in fixed order" name="Series palette" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Series palette</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#1a5b6e"></div><div class="name">series-1</div><div class="hex">#1a5b6e · teal</div></div><div class="sw"><div class="chip" style="background:#6b3a6e"></div><div class="name">series-2</div><div class="hex">#6b3a6e · plum</div></div><div class="sw"><div class="chip" style="background:#8a5a3c"></div><div class="name">series-3</div><div class="hex">#8a5a3c · sepia</div></div><div class="sw"><div class="chip" style="background:#8a5c00"></div><div class="name">series-4</div><div class="hex">#8a5c00 · ochre</div></div><div class="sw"><div class="chip" style="background:#4d7c43"></div><div class="name">series-5</div><div class="hex">#4d7c43 · leaf</div></div></div></body></html>
