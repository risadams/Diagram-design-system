<!-- @dsCard group="Colors" viewport="700x180" subtitle="Parchment-dark blocks, even in light mode — the signature move" name="Code block palette" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Code palette</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  
  body{background:var(--paper);display:block}
  pre{background:#2a2220;color:#f0e6d2;border-radius:4px;padding:14px 16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7}
  .c{color:#a49a8e;font-style:italic}.k{color:#e8659a}.f{color:#b183b5}.s{color:#5ba3b8}.n{color:#c48a1e}.t{color:#b8875f}.p{color:#c8b89a}

</style></head><body><pre><span class="c">// diagram-design profile</span>
<span class="k">const</span> <span class="f">skin</span> <span class="p">=</span> <span class="p">{</span> accent<span class="p">:</span> <span class="s">'#CB0162'</span><span class="p">,</span> grid<span class="p">:</span> <span class="n">4</span> <span class="p">}</span>
<span class="k">export</span> <span class="k">default</span> <span class="t">InkPaper</span></pre></body></html>
