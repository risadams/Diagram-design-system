<!-- @dsCard group="Brand" viewport="700x170" subtitle="Dashed for content dividers and returns; solid for chrome and structure" name="Hairlines" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Hairlines</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  body{display:block}
 .r{padding:10px 0;border-bottom:var(--rule-dashed);display:flex;justify-content:space-between;align-items:baseline}
 .r:last-of-type{border-bottom:var(--rule-solid)}
 .d{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}
 .t{font-size:17px}
</style></head><body><div class="r"><span class="t">Dashed hairline — list rows, sections</span><span class="d">1PX DASHED · INK @ .10</span></div>
<div class="r"><span class="t">Dashed hairline — optional nodes, returns</span><span class="d">STROKE-DASHARRAY 4,3</span></div>
<div class="r"><span class="t">Solid hairline — navbar, footer, legend</span><span class="d">1PX · PAPER-EDGE</span></div></body></html>
