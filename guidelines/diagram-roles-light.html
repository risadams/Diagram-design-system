<!-- @dsCard group="Diagram roles" viewport="700x150" subtitle="Semantic roles diagram-design asks for, light skin" name="Roles — Ink Paper" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Diagram roles light</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#faf6ef"></div><div class="name">paper</div><div class="hex">#faf6ef</div></div><div class="sw"><div class="chip" style="background:#f4ecdd"></div><div class="name">paper-2</div><div class="hex">#f4ecdd</div></div><div class="sw"><div class="chip" style="background:#1a1614"></div><div class="name">ink</div><div class="hex">#1a1614</div></div><div class="sw"><div class="chip" style="background:#6b625a"></div><div class="name">muted</div><div class="hex">#6b625a</div></div><div class="sw"><div class="chip" style="background:#776e65"></div><div class="name">soft</div><div class="hex">#776e65</div></div><div class="sw"><div class="chip" style="background:#CB0162"></div><div class="name">accent</div><div class="hex">#CB0162</div></div><div class="sw"><div class="chip" style="background:#1a5b6e"></div><div class="name">link</div><div class="hex">#1a5b6e</div></div></div></body></html>
