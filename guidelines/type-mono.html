<!-- @dsCard group="Type" viewport="700x170" subtitle="JetBrains Mono for technical values, meta rows and eyebrows" name="Mono — JetBrains Mono" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Mono type</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
       padding:20px 24px;display:flex;align-items:center}
  .row{display:flex;gap:16px;flex-wrap:wrap;width:100%}
  .sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .chip{height:52px;border-radius:6px;border:1px solid rgba(26,22,20,.12)}
  .name{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-mute);text-transform:uppercase}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}
  .note{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
  body{display:block}
 .eb{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-mute)}
 .meta{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-faint);margin-top:10px}
 .sub{font-family:var(--font-mono);font-size:12px;color:var(--ink-teal);margin-top:10px}
</style></head><body><div class="eb">Architecture · Diagram Design</div><div class="meta">2026-09-10 · 8 MIN READ</div><div class="sub">POST /v2/orders · :8443 · gRPC</div>
<div class="note" style="margin-top:14px">Page mono: 12px floor, uppercase, tracked. In-SVG sublabels run 9px.</div></body></html>
